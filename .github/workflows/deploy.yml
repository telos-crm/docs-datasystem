name: Deploy docs

# Build do site (VitePress + Scalar) e publicação no GitHub Pages.
# Disparado em todo push na main — inclusive o sync do openapi.json feito
# pelo api-docs.yml do telos-crm (com GitHub App token, que dispara workflows).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # "/" com domínio próprio (docs-cashback.telosdigital.app.br).
        # Se voltar ao subcaminho do GitHub Pages: DOCS_BASE: /docs-cashback/
        # (não criar dois blocos env no mesmo step — o GHA rejeita YAML com
        # chave duplicada).
        env:
          DOCS_BASE: /
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
